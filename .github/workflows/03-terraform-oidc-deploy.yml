name: "03 - Keyless AWS Terraform Deployment (OIDC)"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "lab"
        type: choice
        options:
          - lab
          - prod
      action:
        description: "Terraform & Security action to execute"
        required: true
        default: "apply_and_test"
        type: choice
        options:
          - apply_and_test
          - e2e_deploy_test_and_destroy
          - plan
          - destroy

permissions:
  id-token: write # Required for requesting AWS STS OIDC token
  contents: read

jobs:
  terraform-deploy:
    name: "Terraform Execution (Keyless AWS OIDC)"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "ap-southeast-1"
      ROLE_TO_ASSUME: "arn:aws:iam::033781183622:role/cloud-devsecops-github-actions-role"
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC (Tokenless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          role-session-name: "GitHubActions-Terraform-Session"
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Caller Identity
        run: |
          echo "Verifying STS Web Identity Federation..."
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Init
        working-directory: terraform/environments/${{ inputs.environment }}
        run: terraform init

      - name: Terraform Plan
        if: ${{ inputs.action == 'plan' }}
        working-directory: terraform/environments/${{ inputs.environment }}
        run: terraform plan -no-color

      - name: Terraform Apply
        id: apply
        if: ${{ inputs.action == 'apply_and_test' || inputs.action == 'e2e_deploy_test_and_destroy' }}
        working-directory: terraform/environments/${{ inputs.environment }}
        run: terraform apply -auto-approve

      - name: Run Live Security Verification & Attack Simulation
        if: ${{ (inputs.action == 'apply_and_test' || inputs.action == 'e2e_deploy_test_and_destroy') && steps.apply.outcome == 'success' }}
        run: |
          echo "Executing automated security test suite..."
          ./tests/security/simulate_attack.sh

      - name: Automated Rollback & Cleanup on Deployment Failure
        if: failure() && steps.apply.outcome == 'failure'
        working-directory: terraform/environments/${{ inputs.environment }}
        run: |
          echo "⚠️ Deployment failed midway! Initiating automated terraform destroy to prevent orphaned cloud resources..."
          terraform destroy -auto-approve

      - name: Automated Post-Test Cleanup (E2E Mode)
        if: ${{ inputs.action == 'e2e_deploy_test_and_destroy' && always() && steps.apply.outcome == 'success' }}
        working-directory: terraform/environments/${{ inputs.environment }}
        run: |
          echo "🧹 E2E Verification complete: cleaning up all AWS resources to reset cost to $0..."
          terraform destroy -auto-approve

      - name: Manual Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: terraform/environments/${{ inputs.environment }}
        run: |
          echo "Executing manual terraform destroy..."
          terraform destroy -auto-approve
