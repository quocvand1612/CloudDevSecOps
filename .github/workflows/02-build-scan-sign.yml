name: "02 - Build, Vulnerability Scan & Keyless Cosign Signing"

on:
  push:
    branches: [main]
    paths:
      - 'k8s/apps/secure-api/**'
      - '.github/workflows/02-build-scan-sign.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # CRITICAL for Keyless OIDC Cosign Signing with Sigstore
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/secure-api

jobs:
  build-scan-sign:
    name: "Container Build, Trivy Scan, SBOM & Keyless Signing"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign (Sigstore Keyless Signing)
        uses: sigstore/cosign-installer@v3.5.0

      - name: Install Syft (SBOM Generator)
        uses: anchore/sbom-action/download-syft@v0.16.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: k8s/apps/secure-api
          file: k8s/apps/secure-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: false

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate Software Bill of Materials (SBOM) with Syft
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest -o cyclonedx-json=sbom-cyclonedx.json
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest -o spdx-json=sbom-spdx.json

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            sbom-cyclonedx.json
            sbom-spdx.json

      - name: Keyless Cryptographic Image Signing with Cosign (Sigstore OIDC)
        run: |
          echo "Signing image keylessly using GitHub Actions OIDC identity..."
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Attach SBOM to Container Image Registry with Cosign
        run: |
          cosign attach sbom --sbom sbom-cyclonedx.json --type cyclonedx ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
