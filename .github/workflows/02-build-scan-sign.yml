name: "02 - Build, Vulnerability Scan & Keyless Cosign Signing"

on:
  push:
    branches: [main]
    paths:
      - 'workloads/devsecops-core/k8s/apps/secure-api/**'
      - '.github/workflows/02-build-scan-sign.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # CRITICAL for Keyless OIDC Cosign Signing with Sigstore
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/secure-api

jobs:
  build-scan-sign:
    name: "Container Build, Trivy Scan, SBOM & Keyless Signing"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Install Cosign (Sigstore Keyless Signing)
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      - name: Install Syft (SBOM Generator)
        uses: anchore/sbom-action/download-syft@e8d2a6937ecead383dfe75190d104edd1f9c5751 # v0.16.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build Container Image
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0 # v5.3.0
        with:
          context: workloads/devsecops-core/k8s/apps/secure-api
          file: workloads/devsecops-core/k8s/apps/secure-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: false

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate Software Bill of Materials (SBOM) with Syft
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest -o cyclonedx-json=sbom-cyclonedx.json
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest -o spdx-json=sbom-spdx.json

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sbom-reports
          path: |
            sbom-cyclonedx.json
            sbom-spdx.json

      - name: Keyless Cryptographic Image Signing with Cosign (Sigstore OIDC)
        run: |
          echo "Signing image keylessly using GitHub Actions OIDC identity..."
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Attach SBOM to Container Image Registry with Cosign
        run: |
          cosign attach sbom --sbom sbom-cyclonedx.json --type cyclonedx ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
